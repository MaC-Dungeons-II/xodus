[package]
name = "xodus-service"
version = "0.1.0"
edition = "2024"
rust-version = { workspace = true }

[dependencies]
xodus = { path = "../xodus" }
tokio = { workspace = true }
reqwest = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
console-subscriber = { workspace = true, optional = true }
quick-xml = { version = "0.42.0", features = ["serialize", "overlapped-lists"] }
tokio-util = "0.7.19"
serde_json = "1.0.151"
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.0"
rand = "0.10.2"
base64 = { workspace = true }
openssl = "0.10.81"
reqwest11 = { package = "reqwest", version = "0.11.27", features = ["json", "stream"] }
xal = { git = "https://github.com/xodus-gaming/xal-rs", rev = "6aa2420f8f0d5e6f7460ff13f399037583a942f4", version = "0.1.3" }

[features]
tokio_console = ["dep:console-subscriber"]
