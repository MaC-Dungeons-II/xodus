syntax = "proto3";

package xodus;

enum XodusMessageType {
    UNKNOWN = 0;
    PING = 1;
    PONG = 2;
    MSA_TOKEN_REQUEST=3;
    MSA_TOKEN_RESPONSE=4;
    STORE_ACCOUNT_CONTEXT_REQUEST=5;
    STORE_ACCOUNT_CONTEXT_RESPONSE=6;
    STORE_GAME_LICENSE_REQUEST=7;
    STORE_GAME_LICENSE_RESPONSE=8;
    // 9/10 are reserved for a future complete entitlement inventory.
    reserved 9, 10;
    STORE_LICENSE_TOKEN_REQUEST=11;
    STORE_LICENSE_TOKEN_RESPONSE=12;
    STORE_COLLECTIONS_REQUEST=13;
    STORE_COLLECTIONS_RESPONSE=14;
    STORE_INVENTORY_REQUEST=15;
    STORE_INVENTORY_RESPONSE=16;
    STORE_PACKAGE_UPDATES_REQUEST=17;
    STORE_PACKAGE_UPDATES_RESPONSE=18;
    STORE_PURCHASE_REQUEST=19;
    STORE_PURCHASE_RESPONSE=20;
}
